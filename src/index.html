<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ho Ho NO</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="%BASE_URL%favicon.ico?v=1" sizes="any" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico?v=1" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico?v=1" />
  </head>
  <body>

    <canvas class="webgl"></canvas>
    
    <p class="timer-text">0:00</p>
    
    <div class="counter-container"> 
      <img src="/ui/skullHead.png" alt="skullHead" class="skullHead" />
    <p class="counter-text">x 0</p>
    </div>  

    <div class="boost-container" aria-label="Boost indicator"></div>

    
      <div class="loading-overlay">

        <svg class="loading-overlay-mask" aria-hidden="true">
          <defs>
            <mask id="loadingHoleMask">
              <!-- white = visible overlay -->
              <rect width="100%" height="100%" fill="white" />
              <!-- black = cut hole (transparent) -->
              <circle class="loading-overlay-mask__hole" cx="50%" cy="50%" r="0" fill="black" />
            </mask>
          </defs>
      
          <rect width="100%" height="100%" fill="#282836" mask="url(#loadingHoleMask)"></rect>
        </svg>

        <div class="loading-loader-container">
        <p class="loading-text">Summoning Santa...</p>

        <div class="load-circle-container">
        <p>0%</p> 
        <svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="200px" height="200px">
         <circle cx="100" cy="100" r="90" stroke-linecap="round" />
          </svg>  
          </div>
      </div>

        <div class="controls-container">
          <div class="control-keyboard">
            <img src="/ui/keyboardControls.png" alt= "keyboardControls" class="keyboardControls" />
            <p class="control-keyboard-text">Move</p>
          </div>

          <div class="control-mouse">
            <img src="/ui/mouseControls.png" alt= "mouseControls" class="mouseControls" />
            <p class="control-mouse-text">Shoot</p>
          </div>
        </div>

        <img id="kaykit-logo" src="/ui/KayKit_logo_red.png" alt="KayKit_logo_red" class="KayKit_logo_red" />

        </div>
      </div>

    <div class="game-over-overlay">
      <!-- the mask layer -->
      <svg class="overlay-mask" aria-hidden="true">
        <defs>
          <mask id="gameOverHoleMask">
            <!-- white = visible overlay -->
            <rect width="100%" height="100%" fill="white" />
            <!-- black = cut hole (transparent) -->
            <circle cx="50%" cy="50%" r="180" fill="black" />
          </mask>
        </defs>
    
        <rect width="100%" height="100%" fill="#B5CFFF" mask="url(#gameOverHoleMask)"></rect>
      </svg>
    
      <!-- your existing markup -->
      <div class="grid-centered-container">
        <div class="game-over-container">
          <h2 class="game-over-title">NO CHRISTMAS THIS YEAR...</h2>
    
          <div class="time-survived-container">
            <img src="/ui/sablier.png" alt="sablier" class="sablier" />
            <p class="time-survived-text">Time survived: 0</p>
          </div>
    
          <div class="enemies-defeated-container">
            <img src="/ui/skullHead.png" alt="skullHead" class="skullHead" />
            <p class="enemies-defeated-text">Enemies defeated: 0</p>
          </div>
    
          <button class="restart-button" onclick="window.location.reload()">Play Again</button>
        </div>
      </div>
    </div>
    


    <script type="module" src="./script.js"></script>
  </body>
</html>
