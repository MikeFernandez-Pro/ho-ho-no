# Every push to main builds the game and publishes it to GitHub Pages.
#
# The repository needs a Pages site whose source is GitHub Actions, created once:
# Settings -> Pages -> Source, or
# `gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow`.
# Until it exists the build job fails on `configure-pages` with a 404.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Bakes the crowds, then the gameplay, headless.
      - run: pnpm test

      - run: pnpm typecheck

      - run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
